name: CI

on:
  push:
    branches: [master, main]
  # Must stay unfiltered so PRs stacked on feature branches still trigger checks.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nickrobison/colophon build-storybook

  storybook-tests:
    name: Storybook Tests (Firefox + WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nickrobison/colophon playwright:install
      - run: pnpm --filter @nickrobison/colophon build-storybook
      - run: pnpm --filter @nickrobison/colophon test-storybook:ci --browsers firefox webkit

  storybook-tests-macos:
    name: Storybook Tests (macOS WebKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nickrobison/colophon exec playwright install webkit
      - run: pnpm --filter @nickrobison/colophon build-storybook
      - run: pnpm --filter @nickrobison/colophon test-storybook:ci --browsers webkit

  forms-e2e:
    name: Forms E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nickrobison/colophon-forms playwright:install
      # The Playwright config builds and serves Storybook on 6407 itself, so no
      # separate build-storybook step. reuseExistingServer is off under CI, which
      # is required here: port 6007 is taken by the apps/demo Storybook and
      # adopting it makes every test fail with a misleading NoStoryMatchError.
      - run: pnpm --filter @nickrobison/colophon-forms test:e2e
