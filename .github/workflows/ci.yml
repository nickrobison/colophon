name: CI

on:
  push:
    branches: [master, main]
  # Must stay unfiltered so PRs stacked on feature branches still trigger checks.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  storybook-tests:
    name: Storybook Tests (${{ matrix.package }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: colophon
            os: ubuntu-latest
            browsers: firefox webkit
            install: firefox webkit
          - package: colophon-forms
            os: ubuntu-latest
            browsers: chromium
            install: chromium
          - package: colophon
            os: macos-latest
            browsers: webkit
            install: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Installed per leg rather than via each package's playwright:install
      # script, because those now serve different consumers: colophon-forms
      # needs firefox for test:e2e but chromium for test-storybook.
      - if: runner.os == 'Linux'
        run: pnpm --filter @nickrobison/${{ matrix.package }} exec playwright install --with-deps ${{ matrix.install }}
      # macOS images already carry the deps, and brew-based --with-deps is slow.
      - if: runner.os != 'Linux'
        run: pnpm --filter @nickrobison/${{ matrix.package }} exec playwright install ${{ matrix.install }}
      # test-storybook:ci only serves storybook-static, it does not build it.
      - run: pnpm --filter @nickrobison/${{ matrix.package }} build-storybook
      - run: pnpm --filter @nickrobison/${{ matrix.package }} test-storybook:ci --browsers ${{ matrix.browsers }}

  forms-e2e:
    name: Forms E2E (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nickrobison/colophon-forms playwright:install
      # The Playwright config builds and serves Storybook on 6407 itself, so no
      # separate build-storybook step. reuseExistingServer is off under CI, which
      # is required here: port 6007 is taken by the apps/demo Storybook and
      # adopting it makes every test fail with a misleading NoStoryMatchError.
      - run: pnpm --filter @nickrobison/colophon-forms test:e2e
